<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <title>Aronaの小屋 - 身份验证</title>
</head>

<body style="margin: 0; padding: 0; background: #f6f7fb; font-family: Arial, Helvetica, sans-serif">
  <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background: #f6f7fb">
    <tr>
      <td align="center" style="padding: 24px 12px">
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600"
          style="max-width: 600px; width: 100%; background: #ffffff; border-radius: 12px; overflow: hidden">
          <tr>
            <td style="padding: 24px 24px 12px; background: #1f2937">
              <div style="color: #ffffff; font-size: 20px; font-weight: 700; letter-spacing: 0.2px">
                Aronaの小屋
              </div>
            </td>
          </tr>

          <tr>
            <td style="padding: 18px 24px 8px">
              <div style="font-size: 16px; font-weight: 700; color: #111827; margin-bottom: 8px">
                你好，{{username}}
              </div>
              <div style="font-size: 14px; line-height: 22px; color: #374151">
                请在页面中输入以下验证码以完成身份验证。
                <div style="margin-top: 8px">
                  验证码有效期：<strong>{{expiration}} 分钟</strong>
                </div>
              </div>
            </td>
          </tr>

          <tr>
            <td style="padding: 12px 24px 10px">
              <div style="text-align: center">
                <div style="font-size: 12px; color: #6b7280; margin-bottom: 6px">
                  验证码
                </div>
                <div
                  style="display: inline-block; padding: 14px 18px; background: #f3f4f6; border-radius: 10px; font-size: 26px; font-weight: 800; color: #111827; letter-spacing: 3px">
                  {{code}}
                </div>
              </div>
            </td>
          </tr>

          <tr>
            <td style="padding: 10px 24px 26px">
              <div style="font-size: 13px; line-height: 20px; color: #6b7280">
                如果不是你发起的身份验证请求，请忽略此邮件或前往网站完成安全检查。
              </div>
            </td>
          </tr>

          <tr>
            <td style="padding: 16px 24px; background: #f9fafb; border-top: 1px solid #eef2f7">
              <div style="font-size: 12px; color: #6b7280; text-align: center">
                © 2026 Aronaの小屋. All Rights Reserved.
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>
